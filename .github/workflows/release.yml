name: Release

# Every push of code to main is tested and, if everything passes, published as a release.
# Pull requests run the same tests without publishing.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: macos-26  # the UI needs the macOS 26 SDK
    timeout-minutes: 30
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenVPN (bundled into the app by build.sh)
        run: brew install openvpn

      - name: Build and test
        run: ./test.sh

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./build.sh dmg
          gh release create "v$VERSION" "build/AppVPN-$VERSION.dmg" --target "$GITHUB_SHA" --title "AppVPN $VERSION" --generate-notes \
            --notes "Open the disk image and drag AppVPN to Applications. Requires macOS 26 or later on Apple silicon; OpenVPN is included. The app is not notarized: run \`xattr -dr com.apple.quarantine /Applications/AppVPN.app\` once before the first launch."
